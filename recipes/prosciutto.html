<body>
    <h1>Prosciutto</h1>
    <img src="" alt="">
    <h2>Ingredients</h2>
    <ul>
        <li>1 cantaloupe - seeded and cut into 8 wedges</li>
        <li>8 thin slices prosciutto</li>
    </ul>
    <br>
    <br>
    <h3>Direction</h3>
    <ol>
        <li>Remove the flesh from the rind of the cantaloupe; wrap each piece of cantaloupe with a slice of prosciutto. Arrange on a platter and serve cold. </li>
    </ol>
